name: Bynd
options:
  bundleIdPrefix: com.bynd
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.13.6"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "2.0.0"
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.9.0"
  # Lurker's recorder and engine, copied in (Packages/Lurker): polished recordings with zooms, a frame and your camera.
  Lurker:
    path: Packages/Lurker

targets:
  Bynd:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Brand
        buildPhase: resources
        type: folder
      - path: Resources/Fonts
        buildPhase: resources
        type: folder
      - path: Resources/Sounds
        buildPhase: resources
        type: folder
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bynd.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: Bynd
        CODE_SIGN_ENTITLEMENTS: Resources/Bynd.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        # Signing comes from Config/Signing.xcconfig: ad-hoc unless you add your own certificate.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "$(BYND_SIGN_IDENTITY)"
        DEVELOPMENT_TEAM: "$(BYND_TEAM)"
      configs:
        debug:
          ENABLE_HARDENED_RUNTIME: "NO"
        release:
          ENABLE_HARDENED_RUNTIME: "YES"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    configFiles:
      Debug: Config/Bynd.xcconfig
      Release: Config/Bynd.xcconfig
    dependencies:
      - package: FluidAudio
      - package: KeyboardShortcuts
      - package: WhisperKit
      - package: Lurker
        product: LurkerCore
      - package: Lurker
        product: LurkerCapture
      - package: Lurker
        product: LurkerEngine
    scheme:
      testTargets:
        - ByndTests
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Bynd
        CFBundleDisplayName: Bynd
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        ByndSite: "$(BYND_SITE)"
        ATSApplicationFontsPath: Fonts
        CFBundleURLTypes:
          - CFBundleURLName: com.bynd.app.links
            CFBundleURLSchemes:
              - bynd
              - oatmeal
        NSMicrophoneUsageDescription: "Bynd turns what you say into text and meeting notes, transcribed on your Mac."
        NSSpeechRecognitionUsageDescription: "Bynd turns what you say into text with Apple's on-device speech recognition when you choose Apple Speech."
        NSCalendarsUsageDescription: "Bynd names your meeting notes after the event in your calendar."
        NSCalendarsFullAccessUsageDescription: "Bynd names your meeting notes after the event in your calendar."
        NSAudioCaptureUsageDescription: "Bynd records meeting audio on your Mac so it can write notes. No bot joins the call."
        NSCameraUsageDescription: "Bynd puts your face in a bubble on screen recordings, when you turn the camera on."

  ByndTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Bynd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bynd.app.tests
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "5.9"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bynd.app/Contents/MacOS/Bynd"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "$(BYND_SIGN_IDENTITY)"
        DEVELOPMENT_TEAM: "$(BYND_TEAM)"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
